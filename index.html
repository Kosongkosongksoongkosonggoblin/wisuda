<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#080b18">
  <title>Undangan Wisuda</title>
  <link rel="icon" type="image/png" href="/assets/img/logo.PNG">
  <link rel="stylesheet" href="./assets/css/style.css">
  <style>
    .landing{display:grid;place-items:center;min-height:100vh;padding:40px 0}
    .landing-inner{width:min(560px,91%)}
    .list{display:grid;gap:16px;margin-top:28px}
    .list a{
      padding:22px 26px;border-radius:18px;text-decoration:none;
      border:1px solid var(--line);background:#ffffff08;color:var(--ink);
      transition:.25s;display:block;
    }
    .list a:hover{border-color:var(--gold);transform:translateY(-3px)}
    .list b{font-size:1.1rem;display:block}
    .list small{color:var(--muted);font-size:.82rem;display:block;margin-top:6px}
  </style>
</head>
<body>
  <canvas id="stars"></canvas>

  <div class="landing">
    <div class="landing-inner">
      <div class="kicker">Graduation</div>
      <h1 style="font:clamp(2.5rem,7vw,4rem)/1 'Playfair Display',serif;margin:14px 0 6px">
        Pilih <em style="color:var(--gold);font-style:italic">undangan.</em>
      </h1>
      <p style="color:var(--muted);line-height:1.7;margin:0 0 10px">
        Silakan pilih wisudawan yang ingin Anda kunjungi undangannya.
      </p>
      <div class="list" id="list">
        <p style="color:var(--muted)">Memuat...</p>
      </div>
      <p class="note" style="text-align:center;margin-top:30px">
        © 2026 .Dibuat dengan rasa syukur
      </p>
    </div>
  </div>

  <script src="./assets/js/stars.js" defer></script>
  <script>
    fetch('./assets/js/app.js')
      .then(r => r.json())
      .then(data => {
        const list = document.getElementById('list');
        const items = Object.values(data);
        if (!items.length) {
          list.innerHTML = '<p style="color:var(--muted)">Belum ada wisudawan.</p>';
          return;
        }
        list.innerHTML = items.map(g => `
          <a href="./u/${g.slug}">
            <b>${g.full_name}</b>
            <small>${g.major || ''}${g.university ? ' · ' + g.university : ''}</small>
          </a>
        `).join('');
      })
      .catch(() => {
        document.getElementById('list').innerHTML =
          '<p style="color:var(--muted)">Gagal memuat data wisudawan.</p>';
      });
  </script>
</body>
</html>
