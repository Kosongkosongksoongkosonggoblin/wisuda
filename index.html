<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Undangan Wisuda</title>
  <link rel="icon" type="image/png" href="./assets/img/logo.PNG">
  <link rel="stylesheet" href="./assets/css/style.css">
  <style>
    body {
      margin: 0; padding: 0; min-height: 100vh;
      background: linear-gradient(140deg, #080b18, #101329 55%, #090b17);
      color: #f8f5ee; font-family: 'DM Sans', sans-serif;
      display: flex; align-items: center; justify-content: center;
    }
    .container {
      width: 90%; max-width: 500px; text-align: left;
      background: rgba(255,255,255,0.03); padding: 40px; border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    h1 { font-family: 'Playfair Display', serif; font-size: 2.5rem; margin-bottom: 10px; }
    h1 em { color: #e8ca8b; }
    p { color: #aab2ca; line-height: 1.6; }
    .btn {
      display: block; padding: 20px; margin-top: 30px;
      background: rgba(232, 202, 139, 0.1); border: 1px solid #e8ca8b;
      border-radius: 15px; text-decoration: none; color: #f8f5ee;
      transition: 0.3s;
    }
    .btn:hover { background: rgba(232, 202, 139, 0.2); transform: translateY(-3px); }
    .btn b { display: block; font-size: 1.2rem; margin-bottom: 5px; }
    .btn small { color: #aab2ca; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Pilih <em>undangan.</em></h1>
    <p>Silakan pilih wisudawan yang ingin Anda kunjungi undangannya.</p>
    
    <!-- TOMBOL LANGSUNG KE UNDANGAN -->

      <b>Rud Tuakia</b>
      <small>Teknik Informatika · Universitas Pattimura</small>
    </a>
  </div>
</body>
</html>
